name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Generated files must be committed
        run: git diff --exit-code -- README.md docs/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Regenerate README tables and site
        run: npm run build
      - name: Generated files must be committed
        run: |
          if ! git diff --quiet -- README.md docs/; then
            echo "README.md or docs/ is out of date. Run 'npm run build' and commit the result." >&2
            git --no-pager diff --stat -- README.md docs/
            exit 1
          fi

  quotes:
    # Every quote in data/matrix.json must still be found at its source. Pages that cannot be
    # fetched are reported, not failed, so a vendor outage does not block unrelated work, except
    # for cells whose evidence this pull request adds or changes: those must be confirmed (see
    # "Evidence the checker cannot read" in CONTRIBUTING.md).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The checkout is GitHub's merge of the pull request into its base; its first parent is
          # that base, which is what the pull request's changes are measured against. Not
          # origin/<base>: the residential task, the reading page and the weekly run commit dates to
          # main between pull requests, and a main that moved after the merge was made would count
          # those dates as changes.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The weekly run can confirm a quote from a capture it read before (src/archive-cache.ts). The
      # gate restores the same list of capture addresses, read-only, or the weekly pull request would
      # fail a check its evidence passed. Only timestamps are cached; each capture is fetched again
      # and checked like any other.
      - name: Restore previously read archive capture addresses
        uses: actions/cache/restore@v6
        with:
          path: .cache/archive-captures.json
          key: archive-captures-none
          restore-keys: archive-captures-
      - run: npm run check -- --changed-since HEAD^1
        env:
          # Who may vouch for a maintainer's reading (a cell verified_via manual): only a pull
          # request opened by an OWNER, MEMBER or COLLABORATOR. See authorityFromEnv in src/check.ts.
          PM_PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
